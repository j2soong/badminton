<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슝민턴 매니저 – 배드민턴 대진표</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="슝민턴 매니저">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>">
<style>
/* ===== 토큰: 리멤버식 무채색 + 단일 오렌지 액센트 ===== */
:root{
  /* 표면 */
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F2F2F2; --raised:#FFFFFF;
  --divider:#D4D4D4; --divider-lite:#EBEBEB;
  /* 전경 */
  --c000:#000000; --c100:#424242; --c150:#808080; --c999:#FFFFFF;
  /* 주 액션(검정 채움) */
  --primary:#000000; --on-primary:#FFFFFF;
  /* 액센트(테마 불변) */
  --accent:#FF6A0D; --accent-bg:#FFF4ED;
  /* 역할 */
  --blue:#0B69EB; --blue-bg:#EDF4FF;
  --red:#ED4E4E; --red-bg:#FFF5F5;
  --yellow:#FDB100; --yellow-bg:#FFF7E5;
  --green:#239E7B; --green-bg:#D9FCF2;
  --ai:#8133FF; --ai-bg:#F9F5FF;
  --ai-grad:linear-gradient(225deg, oklch(0.54 0.255 314) 0%, oklch(0.69 0.123 220) 100%);
  /* 고정(테마 불변) */
  --fixed-black:#000000; --fixed-white:#FFFFFF;
  --court:#000000; --court-line:rgba(255,255,255,.55);
  /* 형태 */
  --r-xs:2px; --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:10px; --r-pill:30px;
  --shadow-1:0 1px 4px rgba(0,0,0,.1); --shadow-2:0 4px 12px rgba(0,0,0,.1); --shadow-3:0 0 16px rgba(0,0,0,.2);
  --hair-top:0 -0.5px 0 var(--divider);
  /* 모션 */
  --dur-fast:200ms; --dur-slow:450ms; --ease:ease-in-out; --ease-out:cubic-bezier(.165,.84,.44,1);
  --font:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1A1A1A; --surface-2:#2E2E2E; --raised:#2E2E2E;
    --divider:#424242; --divider-lite:#2E2E2E;
    --c000:#FFFFFF; --c100:#EBEBEB; --c150:#D4D4D4; --c999:#000000;
    --primary:#FFFFFF; --on-primary:#000000;
    --accent-bg:#331D0F;
    --blue:#418AF0; --blue-bg:#002861; --red:#EB3838; --red-bg:#521D1D;
    --yellow:#D1AD36; --yellow-bg:#383015; --green:#21C798; --green-bg:#1A4D3E;
    --ai:#A770FF; --ai-bg:#291E3C; --on-ai:#000000;
    --court:#2E2E2E;
    --shadow-1:none; --shadow-2:0 4px 12px rgba(0,0,0,.6); --toast-bg:#2E2E2E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1A1A1A; --surface-2:#2E2E2E; --raised:#2E2E2E;
  --divider:#424242; --divider-lite:#2E2E2E;
  --c000:#FFFFFF; --c100:#EBEBEB; --c150:#D4D4D4; --c999:#000000;
  --primary:#FFFFFF; --on-primary:#000000;
  --accent-bg:#331D0F;
  --blue:#418AF0; --blue-bg:#002861; --red:#EB3838; --red-bg:#521D1D;
  --yellow:#D1AD36; --yellow-bg:#383015; --green:#21C798; --green-bg:#1A4D3E;
  --ai:#A770FF; --ai-bg:#291E3C; --on-ai:#000000;
  --court:#2E2E2E;
  --shadow-1:none; --shadow-2:0 4px 12px rgba(0,0,0,.6); --toast-bg:#2E2E2E;
  color-scheme:dark;
}

/* ===== 기본 ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--c000);font-family:var(--font);font-size:16px;line-height:1.45;letter-spacing:0;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fixed-black)}
button,input,select{font:inherit;color:inherit;letter-spacing:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c000);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 112px}
.sheet-body,.sheet{overscroll-behavior:contain}

/* ===== 헤더: 통짜 검정 바 ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fixed-black);color:var(--fixed-white);padding:12px 16px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.top h1{font-size:18px;font-weight:600;line-height:1.3;margin:0;flex:none;white-space:nowrap}
.counts{display:flex;gap:4px;flex:1 1 100%;order:2;overflow-x:auto;scrollbar-width:none}
.counts::-webkit-scrollbar{display:none}
.count{flex:none}
.count{font-size:12px;font-weight:500;line-height:1.33;color:#D4D4D4;background:#2E2E2E;border-radius:var(--r-pill);padding:4px 10px}
.count b{color:var(--fixed-white);font-weight:600;margin-left:2px}
.count.late{background:var(--yellow);color:#000000}
.count.late b{color:#000000}
.sync{flex:1;min-width:0;font-size:12px;line-height:1.33;color:#BDBDBD;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{box-shadow:inset 0 -1px 0 #1A1A1A}

/* ===== 제목·문구 ===== */
h2{font-size:20px;font-weight:600;line-height:1.3;color:var(--c100);margin:32px 0 12px;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
h2 small{font-size:12px;font-weight:500;color:var(--c150)}
.muted{color:var(--c100);font-size:14px;line-height:1.45}

/* ===== 버튼 ===== */
.btn{min-height:44px;border-radius:var(--r-md);border:1px solid var(--divider);background:var(--surface);color:var(--c000);padding:0 12px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color var(--dur-fast) var(--ease),opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--c100)}
.btn.late{background:var(--yellow);border-color:var(--yellow);color:#000000}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.sm{min-height:40px;font-size:14px}
@media (hover:hover){
  .btn:not(.primary):not(:disabled):hover{background:var(--surface-2)}
  .btn.primary:not(:disabled):hover{opacity:.85}
  .btn.ghost:hover{color:var(--accent)}
}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.resv-actions>.btn.primary{flex:2}

/* ===== 코트: 검정 코트 위 흰 라인 ===== */
.court{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite),var(--shadow-1);padding:16px;margin-bottom:12px}
.court-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.court-head strong{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.court-head>span{font-size:14px;color:var(--c100)}
.field{position:relative;border-radius:var(--r-sm);background:var(--court);padding:16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;min-height:120px;align-content:center;
  background-image:linear-gradient(var(--court-line),var(--court-line)),linear-gradient(var(--court-line),var(--court-line));
  background-size:calc(100% - 16px) 1px,calc(100% - 16px) 1px;background-position:center 8px,center calc(100% - 8px);background-repeat:no-repeat}
.field::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--fixed-white) 0 4px,transparent 4px 8px);opacity:.8}
.field.undecided{gap:8px}
.field.undecided::after{display:none}
.field.empty{min-height:64px;padding:12px;background:var(--surface-2);background-image:none;color:var(--c100);display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center}
.field.empty::after{display:none}
.side{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:6px;border-radius:var(--r-sm);padding:8px 10px;font-size:16px;font-weight:600;min-width:0;line-height:1.3;color:var(--c000)}
.chip.m{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.chip.f{background:var(--red-bg);box-shadow:inset 3px 0 0 var(--red)}
.chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lv{font-size:12px;font-weight:600;border-radius:var(--r-xs);padding:0 5px;line-height:18px;background:var(--surface);color:var(--c100);box-shadow:inset 0 0 0 1px var(--divider);flex:none}
.lv.S{background:var(--c000);color:var(--c999);box-shadow:none}
.court-actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:12px}
.court-actions.two{grid-template-columns:1fr 1fr}
.court-actions.one{grid-template-columns:1fr}
.court-actions.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.court-actions.three .btn{font-size:14px;padding:0 4px}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--on-ai,#FFFFFF)}
@media (hover:hover){.btn.ai:not(:disabled):hover{background:var(--ai);opacity:.88}}
.court-actions .btn{padding:0 8px;white-space:nowrap}

/* ===== 예약 ===== */
.resv{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);padding:16px;margin-bottom:8px}
.resv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.resv-head strong{font-size:16px;font-weight:600}
.chips4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:14px;color:var(--c000);background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 12px}

/* ===== 뱃지 ===== */
.tag{font-size:12px;font-weight:600;line-height:18px;border-radius:var(--r-xs);padding:0 6px;background:var(--surface-2);color:var(--c100);flex:none;white-space:nowrap}
.tag.play{background:var(--green-bg);color:var(--c000);box-shadow:inset 0 0 0 1px var(--green)}
.tag.warn{background:var(--accent-bg);color:var(--c000);box-shadow:inset 0 0 0 1px var(--accent)}
.tag.late{background:var(--yellow);color:#000000}
.tag.alert{background:var(--accent);color:#000000}
.tag.few{background:var(--green-bg);color:var(--c000);box-shadow:inset 0 0 0 1px var(--green)}
.tag.pair{background:var(--surface-2);color:var(--c100);box-shadow:inset 0 0 0 1px var(--divider)}
.tag.auto{background:var(--ai-bg);color:var(--ai)}

/* ===== 선수 카드 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcard{text-align:left;border:none;border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:72px;position:relative;color:var(--c000);transition:transform var(--dur-fast) var(--ease)}
.pcard:active{transform:scale(.97)}
.pcard.m{background:var(--blue-bg);box-shadow:inset 3px 0 0 var(--blue)}
.pcard.f{background:var(--red-bg);box-shadow:inset 3px 0 0 var(--red)}
.pcard.m.alert{box-shadow:inset 3px 0 0 var(--blue),inset 0 0 0 2px var(--accent)}
.pcard.f.alert{box-shadow:inset 3px 0 0 var(--red),inset 0 0 0 2px var(--accent)}
.pcard .top-line{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap}
.pcard .n{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:4.5em}
.pcard .meta{font-size:12px;font-weight:500;line-height:1.33;color:var(--c100);display:flex;gap:8px;flex-wrap:wrap}
.pcard.dim{opacity:.4}
.pcard.sel{outline:2px solid var(--c000);outline-offset:-2px}
.pcard .check{position:absolute;right:8px;bottom:8px;width:20px;height:20px;border-radius:50%;background:var(--c000);color:var(--c999);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.scard{position:relative}
.scard .pcard{width:100%;padding-right:44px}
.scard .edit{position:absolute;top:2px;right:2px;width:44px;height:44px;border:none;background:transparent;border-radius:var(--r-md);color:var(--c100);font-size:18px;line-height:1}

/* ===== 필터·입력 ===== */
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;align-items:center}
.seg::-webkit-scrollbar{display:none}
.pill{min-height:36px;border-radius:var(--r-pill);border:1px solid var(--divider);background:var(--surface);color:var(--c100);padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;flex:none;position:relative;transition:background-color var(--dur-fast) var(--ease)}
.pill::after{content:"";position:absolute;inset:-4px 0}
.pill[aria-pressed="true"]{background:var(--c000);color:var(--c999);border-color:var(--c000);font-weight:600}
.pill.ai{color:var(--ai);border-color:var(--ai);font-weight:600}
.pill.m[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue);color:var(--c000)}
.pill.f[aria-pressed="true"]{background:var(--red-bg);border-color:var(--red);color:var(--c000)}
select,input[type=text],input[type=search],input[type=time]{min-height:48px;border-radius:var(--r-sm);border:1px solid var(--c150);background:var(--surface);padding:0 14px;font-size:16px;width:100%;color:var(--c000)}
input::placeholder{color:var(--c150)}
input[type=time]{font-size:18px}
.label{font-size:14px;font-weight:600;color:var(--c100);margin:20px 0 8px;display:block}

/* ===== 목록·표 ===== */
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:8px 16px;box-shadow:inset 0 1px 0 var(--divider-lite);min-height:56px}
.li:first-child{box-shadow:none}
button.li{width:100%;border:none;background:transparent;text-align:left}
@media (hover:hover){button.li:hover{background:var(--surface-2)}}
.li .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{font-size:12px;color:var(--c100);flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.m{background:var(--blue)} .dot.f{background:var(--red)}
.tablebox{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 16px;box-shadow:inset 0 1px 0 var(--divider-lite)}
th{font-weight:600;font-size:12px;color:var(--c100);background:var(--surface-2);box-shadow:none}
td.r,th.r{text-align:right}
.logitem{padding:12px 16px;box-shadow:inset 0 1px 0 var(--divider-lite);font-size:14px}
.logitem:first-child{box-shadow:none}
.logitem .t{color:var(--c100);font-size:12px;font-weight:500;margin-bottom:2px}

/* ===== 설정 ===== */
.stepper,.setbox{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);padding:16px;margin-bottom:12px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .v{font-size:20px;font-weight:600;min-width:48px;text-align:center}
.stepper .lab{flex:1;font-weight:600}
.stepper .btn,.minirow .btn{width:44px;padding:0;font-size:20px;font-weight:500}
.setbox .seg{margin-top:8px}
.setbox .sub{font-size:14px;font-weight:600;color:var(--c100);margin-top:16px;display:flex;align-items:center;gap:6px}
.minirow{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;box-shadow:inset 0 1px 0 var(--divider-lite)}
.minirow .v{font-size:18px;font-weight:600;min-width:64px;text-align:center}

/* ===== AI 자동 매칭·스위치 ===== */
.autobox{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);padding:16px;margin:16px 0 12px;overflow:hidden}
.autobox.on{background:var(--ai-bg);box-shadow:0 0 0 1px var(--ai)}
.autobox.on::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--ai-grad)}
.autorow{display:flex;align-items:center;gap:12px}
.autorow .t{flex:1;min-width:0}
.autorow strong{display:block;font-size:16px;font-weight:600}
.autorow small{display:block;font-size:12px;font-weight:500;line-height:1.33;color:var(--c100);margin-top:2px}
.switch{width:52px;height:32px;border-radius:var(--r-pill);border:none;background:var(--c150);position:relative;flex:none;padding:0;transition:background-color var(--dur-fast) var(--ease)}
.switch::before{content:"";position:absolute;inset:-6px -2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform var(--dur-fast) var(--ease-out)}
.switch[aria-checked="true"]{background:var(--c000)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.autobox .switch[aria-checked="true"]{background:var(--ai)}

.empty-box{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--divider-lite);padding:32px 16px;text-align:center;color:var(--c100);font-size:14px}
.empty-box .btn{margin-top:16px}

/* ===== 하단 탭 ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:var(--hair-top);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:none;background:none;min-height:56px;font-size:12px;font-weight:500;color:var(--c150);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button svg{width:22px;height:22px;stroke-width:1.5}
.nav button[aria-current="page"]{color:var(--c000);font-weight:600}
.nav button[aria-current="page"] svg{stroke-width:2}

/* ===== 시트 ===== */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.backdrop.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--raised);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-3);max-height:88%;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
@media (min-width:768px){.sheet{left:50%;right:auto;width:680px;margin-left:-340px}}
.sheet-head{padding:20px 20px 12px;display:flex;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-size:18px;font-weight:600;line-height:1.3;flex:1;display:flex;align-items:center;gap:6px}
.sheet-body{padding:0 20px 16px;overflow-y:auto;flex:1}
.sheet-foot{padding:12px 20px;box-shadow:var(--hair-top);display:flex;gap:8px}
.sheet-foot .btn{flex:1;min-height:52px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.slot{border:1px dashed var(--c150);border-radius:var(--r-sm);min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--c100)}
.slot.chip{border:none;justify-content:flex-start;padding-right:2px}
.slot button{border:none;background:none;min-width:32px;min-height:32px;font-size:18px;line-height:1;color:var(--c100)}
.rec{background:var(--surface-2);border-radius:var(--r-md);padding:12px;margin-bottom:12px}
.rec .seg{flex-wrap:wrap;overflow:visible;gap:6px}
.rec .pill{padding:0 12px}
.rec p{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--c100)}
.actlist{display:flex;flex-direction:column;gap:8px}
.actlist .btn{justify-content:flex-start;min-height:48px;padding:0 16px}
.gender-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender-pick button{min-height:52px;border-radius:var(--r-md);border:1px solid var(--divider);background:var(--surface);font-weight:600;font-size:16px;color:var(--c100)}
.gender-pick button.m[aria-pressed="true"]{background:var(--blue-bg);border:2px solid var(--blue);color:var(--c000)}
.gender-pick button.f[aria-pressed="true"]{background:var(--red-bg);border:2px solid var(--red);color:var(--c000)}
.level-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.level-pick button{min-height:52px;border-radius:var(--r-md);border:1px solid var(--divider);background:var(--surface);font-weight:600;font-size:16px;color:var(--c100);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.level-pick button small{font-size:11px;font-weight:500;margin-top:2px}
.level-pick button[aria-pressed="true"]{background:var(--c000);color:var(--c999);border-color:var(--c000)}
.err{color:var(--red);font-size:14px;margin:8px 0 0}

/* ===== 하단 고정 참가 바·토스트 ===== */
.joinbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin-top:16px;z-index:4}
.joinbar .btn{width:100%;min-height:52px;box-shadow:var(--shadow-2)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:60;max-width:520px;margin:0 auto;background:var(--toast-bg,rgba(0,0,0,.9));color:#FFFFFF;border-radius:var(--r-md);padding:15px 20px;box-shadow:0 0 0 1px rgba(255,255,255,.08);font-size:14px;line-height:1.45;display:none;align-items:center;gap:12px}
.toast.on{display:flex}
.toast span{flex:1}
.toast button{border:none;background:none;color:var(--accent);font-weight:600;min-height:40px;padding:0 4px;flex:none}
body.has-joinbar .toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){
  .sheet.on{animation:sheetUp var(--dur-slow) var(--ease-out)}
  .toast.on{animation:toastIn var(--dur-fast) var(--ease-out)}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top">
  <div class="top-in">
    <h1>슝민턴 매니저</h1>
    <div class="sync" id="sync">이 휴대폰에 자동 저장돼요</div>
    <div class="counts" id="counts"></div>
  </div>
</header>
<main class="wrap" id="main"></main>

<nav class="nav" aria-label="화면 전환">
  <div class="nav-in">
    <button data-tab="court" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16M3 9h18M3 15h18"/></svg>코트</button>
    <button data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c2.6 0 4.4 1.5 5 4"/></svg>선수</button>
    <button data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>기록·설정</button>
  </div>
</nav>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>되돌리기</button></div>

<script>
(function(){
"use strict";
// ---------- 상수 ----------
const LEVELS = ["S","A","B","C","D","E"];
const LV_SCORE = {S:6,A:5,B:4,C:3,D:2,E:1};
const MAX_RESERVES = 2;
const LS_KEY = "cock-manager-v1";
const MODES = [
  {id:"MM", label:"남복", need:{M:4,F:0}},
  {id:"FF", label:"여복", need:{M:0,F:4}},
  {id:"MX", label:"혼복", need:{M:2,F:2}},
  {id:"M1F3", label:"남1 여3", need:{M:1,F:3}}
];

// ---------- 상태 ----------
function freshState(){
  return {v:1, updatedAt:0, courtCount:3, players:{}, courts:[], reserves:[], log:[], auto:{on:false, style:"balance"}, coach:{on:false, play:3, rest:1}, alert:{wait:20, gap:2}};
}
let state = freshState();
const ui = {tab:"court", sort:"wait", g:"all", st:"all", lv:[], q:"", sheet:null, joinSel:[]};
let pendingAuto = [];
let undoSnap = null, toastTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function P(id){ return state.players[id]; }
function ensureCourts(){
  while(state.courts.length < state.courtCount) state.courts.push({players:null, teams:null, teamIdx:0, startedAt:0, snap:null});
  if(state.courts.length > state.courtCount) state.courts.length = state.courtCount;
}
function curWait(p){ return p.status === "waiting" && p.waitSince ? Math.max(0, now() - p.waitSince) : 0; }
function totalWait(p){ return (p.waitTotal || 0) + curWait(p); }
function fmtMin(ms){
  const m = Math.floor(ms / 60000);
  if(m < 1) return "1분 미만";
  if(m < 60) return m + "분";
  return Math.floor(m/60) + "시간 " + (m%60) + "분";
}
function fmtClock(t){ const d = new Date(t); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function groupKey(ids){ return ids.slice().sort().join("|"); }
function reserveIndexOf(id){ return state.reserves.findIndex(r => r.players.includes(id)); }
function present(){ return Object.values(state.players).filter(p => p.status !== "gone"); }

// ---------- 저장 (이 기기 + 계정) ----------
let docRef = null, writing = false, dirty = false, saveTimer = null, remoteReady = false;
function setSync(t){ document.getElementById("sync").textContent = t; }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const s = JSON.parse(raw); if(s && s.players) return s; } }catch(e){}
  return null;
}
function scheduleRemote(){
  if(!docRef) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushRemote, 700);
}
async function flushRemote(){
  if(!docRef || writing || !dirty) return;
  writing = true; dirty = false; setSync("저장 중…");
  try{
    await docRef.set({json: JSON.stringify(state), updatedAt: state.updatedAt});
    setSync("내 계정에 저장됨 · 다른 기기에서도 이어서 쓸 수 있어요");
  }catch(e){
    dirty = true;
    setSync("계정 저장에 실패했어요. 이 기기에는 저장돼 있고, 연결되면 다시 저장해요");
  }finally{
    writing = false;
    if(dirty) saveTimer = setTimeout(flushRemote, 1500);
  }
}
function commit(opt){
  if(!(opt && opt.noAuto)) autoFill();
  state.updatedAt = now();
  saveLocal();
  scheduleRemote();
  render();
  if(pendingAuto.length) setTimeout(() => { if(pendingAuto.length) toast(""); }, 0);
}
function initRemote(){
  setSync("이 휴대폰에 자동 저장돼요");
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

// ---------- 동작 ----------
function snapshotForUndo(){ undoSnap = JSON.stringify(state); }
function addPlayer(name, level, gender){
  const id = uid();
  state.players[id] = {id, name, level, gender, status:"waiting", games:0, waitTotal:0, waitSince:now(), lastGroup:"", createdAt:now()};
  return id;
}
function joinPlayer(id){ const p = P(id); if(!p || p.status !== "gone") return; p.status = "waiting"; p.waitSince = now(); }
function stopWait(p){ if(p.status === "waiting" && p.waitSince){ p.waitTotal = (p.waitTotal||0) + (now() - p.waitSince); } p.waitSince = null; }
function restPlayer(id){ const p = P(id); if(p.status !== "waiting") return; stopWait(p); p.status = "resting"; }
function resumePlayer(id){ const p = P(id); if(p.status !== "resting") return; p.status = "waiting"; p.waitSince = now(); }
function sendHome(id){
  const p = P(id); if(p.status === "playing") return false;
  stopWait(p); p.status = "gone"; p.lateAt = "";
  state.reserves.forEach(r => { r.players = r.players.filter(x => x !== id); r.teams = null; });
  return true;
}
function startGame(ci, ids, teams){
  const c = state.courts[ci];
  c.snap = {};
  ids.forEach(id => { const p = P(id); c.snap[id] = {status:p.status, waitTotal:p.waitTotal, waitSince:p.waitSince, coachRest:p.coachRest||0}; stopWait(p); p.status = "playing"; p.coachRest = 0; });
  c.coachDec = [];
  if(coachCfg().on) present().forEach(p => {
    if(p.level === "S" && !ids.includes(p.id) && p.status === "waiting" && (p.coachRest||0) > 0){ p.coachRest--; c.coachDec.push(p.id); }
  });
  c.players = ids.slice(); c.teams = teams || null; c.teamIdx = 0; c.startedAt = now(); c.hold = false; c.auto = false;
}
function endGame(ci){
  const c = state.courts[ci]; if(!c.players) return;
  const key = groupKey(c.players);
  const cc = coachCfg();
  c.players.forEach(id => {
    const p = P(id); if(!p) return; p.games = (p.games||0) + 1; p.status = "waiting"; p.waitSince = now(); p.lastGroup = key;
    if(cc.on && p.level === "S"){ p.coachStreak = (p.coachStreak||0) + 1; if(p.coachStreak >= cc.play){ p.coachRest = cc.rest; p.coachStreak = 0; } }
  });
  state.log.unshift({court:ci+1, players:c.players.slice(), teams:c.teams, start:c.startedAt, end:now()});
  if(state.log.length > 300) state.log.length = 300;
  c.players = null; c.teams = null; c.snap = null; c.startedAt = 0; c.auto = false;
  c.hold = true; // 끝난 코트는 자동 매칭이 바로 채우지 않고 비워 둠
}
function cancelGame(ci){
  const c = state.courts[ci]; if(!c.players) return;
  (c.coachDec || []).forEach(id => { const q = P(id); if(q) q.coachRest = (q.coachRest||0) + 1; });
  c.coachDec = [];
  c.players.forEach(id => { const q = P(id), sn = c.snap && c.snap[id]; if(q && sn) q.coachRest = sn.coachRest || 0; });
  c.players.forEach(id => {
    const p = P(id); if(!p) return; const s = c.snap && c.snap[id];
    if(s){ p.status = s.status === "playing" ? "waiting" : s.status; p.waitTotal = s.waitTotal; p.waitSince = s.status === "waiting" ? s.waitSince : (p.status === "waiting" ? now() : null); }
    else { p.status = "waiting"; p.waitSince = now(); }
  });
  c.players = null; c.teams = null; c.snap = null; c.startedAt = 0; c.auto = false;
  c.hold = true; // 취소한 코트도 비워 둠
}

// 팀 나누기: 급수 점수 + 혼성일 때 남자 보정치
function teamOptions(ids){
  const ps = ids.map(P);
  const mixed = new Set(ps.map(p => p.gender)).size > 1;
  const males = ps.filter(p => p.gender === "M").length;
  const w = p => LV_SCORE[p.level] + (mixed && p.gender === "M" ? 1.5 : 0);
  const pairs = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  return pairs.map(pr => {
    const a = pr[0].map(i => ps[i]), b = pr[1].map(i => ps[i]);
    let cost = Math.abs(a.reduce((s,p)=>s+w(p),0) - b.reduce((s,p)=>s+w(p),0));
    if(males === 2 && (a[0].gender === a[1].gender)) cost += 10; // 혼복은 남녀 한 쌍씩
    if(a.some(x => x.partner && b.some(y => y.id === x.partner))) cost += 100; // 고정 파트너는 같은 팀
    return {teams:[pr[0].map(i => ids[i]), pr[1].map(i => ids[i])], cost};
  }).sort((x,y) => x.cost - y.cost);
}
function splitCourt(ci){
  const c = state.courts[ci];
  const opts = teamOptions(c.players);
  if(c.teams){ c.teamIdx = (c.teamIdx + 1) % opts.length; } else c.teamIdx = 0;
  c.teams = opts[c.teamIdx].teams;
}

// ---- 매칭 엔진 ----
// 고정 파트너는 한 묶음(unit)으로 다루고, 대기 순위 + 성별 구성 + 팀 균형 + 직전 4명 중복을 점수로 비교한다
function waitOrder(a, b){ return curWait(b) - curWait(a) || (a.games||0) - (b.games||0); }
function coachCfg(){ const c = state.coach || {}; return {on:!!c.on, play:c.play || 3, rest:c.rest || 1}; }
function coachCapped(p){ return p.level === "S" && coachCfg().on && (p.coachRest||0) > 0; } // 코치 휴식 차례
function matchUnits(pool){
  const inPool = new Set(pool.map(p => p.id)), used = new Set(), units = [];
  pool.slice().sort(waitOrder).forEach(p => {
    if(used.has(p.id)) return;
    const q = p.partner && P(p.partner);
    if(q && q.status !== "gone"){
      if(inPool.has(q.id)){ units.push([p, q]); used.add(p.id); used.add(q.id); }
      return; // 파트너가 게임·휴식·늦참·예약 중이면 같이 들어갈 때까지 기다림
    }
    units.push([p]); used.add(p.id);
  });
  return units;
}
function genderPenalty(m, style){
  if(style === "mixed") return m === 2 ? 0 : m === 1 ? 2 : m === 3 ? 4 : 3;
  if(style === "same") return (m === 0 || m === 4) ? 0 : m === 2 ? 3 : 5;
  return (m === 0 || m === 2 || m === 4) ? 0 : m === 1 ? 1 : 3; // 균형 맞춤
}
function bestGroup(pool, opt){
  const rank = {}; pool.slice().sort(waitOrder).forEach((p, i) => { rank[p.id] = i; });
  const units = matchUnits(pool).slice(0, 12);
  let best = null, bestScore = Infinity, bestSame = false;
  const evalGroup = chosen => {
    const g = [].concat(...chosen), ids = g.map(p => p.id);
    const m = g.filter(p => p.gender === "M").length;
    if(opt.need && (m !== opt.need.M || 4 - m !== opt.need.F)) return;
    const key = groupKey(ids), same = ids.every(id => P(id).lastGroup === key);
    const score = ids.reduce((t, id) => t + rank[id], 0) + (opt.style ? genderPenalty(m, opt.style) * 3 : 0) + teamOptions(ids)[0].cost * 1.5 + (same ? 100 : 0);
    if(score < bestScore){ bestScore = score; best = ids; bestSame = same; }
  };
  const rec = (from, chosen, size) => {
    if(size === 4){ evalGroup(chosen); return; }
    for(let u = from; u < units.length; u++){
      if(size + units[u].length <= 4){ chosen.push(units[u]); rec(u + 1, chosen, size + units[u].length); chosen.pop(); }
    }
  };
  if(opt.anchor){ if(units.length) rec(1, [units[0]], units[0].length); } else rec(0, [], 0);
  return best ? {ids: best, same: bestSame} : null;
}
function recommend(modeId, pool){
  const mode = MODES.find(m => m.id === modeId);
  pool = pool.filter(p => !coachCapped(p));
  if(mode.need){ pool = pool.filter(p => mode.need[p.gender] > 0); }
  const res = bestGroup(pool, {need: mode.need});
  if(!res){
    const avail = [].concat(...matchUnits(pool));
    if(mode.need){
      const haveM = avail.filter(p => p.gender === "M").length, haveF = avail.filter(p => p.gender === "F").length;
      if(haveM < mode.need.M || haveF < mode.need.F){
        const lack = [];
        if(haveM < mode.need.M) lack.push("남자 " + haveM + "/" + mode.need.M + "명");
        if(haveF < mode.need.F) lack.push("여자 " + haveF + "/" + mode.need.F + "명");
        return {err: mode.label + "에 들어갈 수 있는 선수가 부족해요 (" + lack.join(", ") + ")"};
      }
      return {err: mode.label + " 4명을 맞추지 못했어요. 고정 파트너는 둘이 함께 들어가야 해서 그래요"};
    }
    return {err: "함께 들어갈 수 있는 선수가 4명보다 적어요 (" + avail.length + "명)"};
  }
  return {ids: res.ids, warn: res.same ? "직전 게임과 같은 4명밖에 구성할 수 없어요" : ""};
}
function autoPick(pool, style){
  const res = bestGroup(pool.filter(p => !coachCapped(p)), {style, anchor: true});
  return res ? res.ids : null;
}
function autoFill(){
  if(!state.auto || !state.auto.on) return;
  ensureCourts();
  state.courts.forEach((c, i) => {
    if(c.players || c.hold) return;
    const ri = state.reserves.findIndex(r => r.players.length === 4 && r.players.every(id => P(id) && P(id).status === "waiting"));
    if(ri >= 0){ const rv = state.reserves[ri]; startGame(i, rv.players, rv.teams); state.reserves.splice(ri, 1); c.auto = true; pendingAuto.push(i+1); return; }
    const ids = autoPick(present().filter(p => p.status === "waiting" && reserveIndexOf(p.id) < 0), state.auto.style);
    if(ids){ startGame(i, ids); c.auto = true; pendingAuto.push(i+1); }
  });
}
function setPartner(a, b){ clearPartner(a); clearPartner(b); P(a).partner = b; P(b).partner = a; }
function clearPartner(a){ const p = P(a); if(!p || !p.partner) return; const q = P(p.partner); if(q && q.partner === a) q.partner = ""; p.partner = ""; }
function fewGamesLimit(){
  const ps = present().filter(p => p.level !== "S" && p.status !== "late");
  if(!ps.length) return -1;
  const avg = ps.reduce((t, p) => t + (p.games||0), 0) / ps.length;
  return avg - ((state.alert && state.alert.gap) || 2);
}

// ---------- 렌더 ----------
const main = document.getElementById("main");
function chipHTML(id, extra){
  const p = P(id);
  if(!p) return '<div class="chip m"><span class="n">삭제된 선수</span></div>';
  return '<div class="chip ' + (p.gender === "M" ? "m" : "f") + '"><span class="n">' + esc(p.name) + '</span><span class="lv ' + p.level + '">' + p.level + '</span>' + (extra || "") + '</div>';
}
function renderCounts(){
  const ps = present();
  const n = s => ps.filter(p => p.status === s).length;
  document.getElementById("counts").innerHTML =
    '<span class="count">대기 <b class="num">' + n("waiting") + '</b></span>' +
    '<span class="count">게임 중 <b class="num">' + n("playing") + '</b></span>' +
    '<span class="count">휴식 <b class="num">' + n("resting") + '</b></span>' +
    (n("late") ? '<span class="count late">늦참 <b class="num">' + n("late") + '</b></span>' : '');
}
function renderCourtTab(){
  const on = !!(state.auto && state.auto.on);
  let h = '<div class="autobox' + (on ? " on" : "") + '"><div class="autorow"><div class="t"><strong id="autoLbl">AI 자동 매칭</strong><small>' +
    (on ? '아직 안 쓴 코트를 자동으로 채워요. 게임이 끝난 코트는 비워 둬요' : '켜면 아직 안 쓴 코트를 자동으로 채워요') +
    '</small></div><button class="switch" role="switch" aria-checked="' + on + '" aria-labelledby="autoLbl" data-act="autoToggle"></button></div>';
  if(on){
    h += '<div class="seg" role="group" aria-label="자동 매칭 구성" style="margin-top:10px">' +
      [["balance","균형 맞춤"],["mixed","혼복 우선"],["same","남복·여복 우선"]].map(x => '<button class="pill" data-act="autoStyle" data-v="' + x[0] + '" aria-pressed="' + (state.auto.style === x[0]) + '">' + x[1] + '</button>').join("") + '</div>';
  }
  h += '</div>';
  const firstReady = state.reserves.findIndex(r => r.players.length === 4 && r.players.every(id => P(id) && P(id).status === "waiting"));
  state.courts.forEach((c, i) => {
    h += '<article class="court" aria-label="' + (i+1) + '번 코트">';
    if(!c.players){

function cardHTML(p, o){
  o = o || {};
  const ri = reserveIndexOf(p.id);

  else if(p.status === "resting") tag = '<span class="tag">휴식</span>';
  else if(p.status === "late") tag = '<span class="tag late">늦참' + (p.lateAt ? " " + p.lateAt : "") + '</span>';
  else if(ri >= 0) tag = '<span class="tag warn">예약' + (ri+1) + '</span>';
  const al = state.alert || {wait:20, gap:2};
  const longWait = p.status === "waiting" && !coachCapped(p) && curWait(p) >= al.wait * 60000;
  const few = p.status === "waiting" && p.level !== "S" && (p.games||0) <= fewGamesLimit();
  const mate = p.partner && P(p.partner);
  let extra = '';
  if(longWait) extra += '<span class="tag alert">오래 대기</span>';
  if(few) extra += '<span class="tag few">게임 적음</span>';
  if(coachCapped(p)) extra += '<span class="tag">코치 휴식 ' + p.coachRest + '게임</span>';
  else if(p.level === "S" && coachCfg().on && p.status !== "gone") extra += '<span class="tag">' + (p.coachStreak||0) + '/' + coachCfg().play + '게임</span>';
  if(mate) extra += '<span class="tag pair">짝 ' + esc(mate.name) + '</span>';
  const waitTxt = p.status === "waiting" ? '대기 ' + fmtMin(curWait(p)) : (p.status === "playing" ? '게임 중' : p.status === "late" ? '도착 전' : '휴식 중');
  return '<button class="pcard ' + (p.gender === "M" ? "m" : "f") + (longWait ? " alert" : "") + (o.sel ? " sel" : "") + (o.dim ? " dim" : "") + '" data-act="' + o.act + '" data-id="' + p.id + '"' + (o.dim ? ' aria-disabled="true"' : "") + (o.sel !== undefined ? ' aria-pressed="' + (!!o.sel) + '"' : "") + '>' +
    '<span class="top-line"><span class="n">' + esc(p.name) + '</span><span class="lv ' + p.level + '">' + p.level + '</span>' + tag + extra + '</span>' +
    '<span class="meta num"><span>' + (p.games||0) + '게임</span><span>' + waitTxt + '</span></span>' +
    '<span class="meta num"><span>누적 대기 ' + fmtMin(totalWait(p)) + '</span></span>' +
    (o.sel ? '<span class="check" aria-hidden="true">' + o.selNo + '</span>' : "") +
    '</button>';
}
function sortPlayers(arr, key){
  const by = {
    wait:(a,b) => curWait(b) - curWait(a) || totalWait(b) - totalWait(a),
    total:(a,b) => totalWait(b) - totalWait(a),
    games:(a,b) => (a.games||0) - (b.games||0) || curWait(b) - curWait(a),
    level:(a,b) => LV_SCORE[b.level] - LV_SCORE[a.level] || a.name.localeCompare(b.name,"ko"),
    name:(a,b) => a.name.localeCompare(b.name,"ko")
  };
  return arr.slice().sort(by[key] || by.wait);
}

  document.getElementById("toastMsg").textContent = msg;
  u.hidden = !undo;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove("on"); if(undo) undoSnap = null; }, undo ? 6000 : 2500);
}

        const ids = autoPick(pool, (state.auto && state.auto.style) || "balance");
        const n = pool.filter(p => !coachCapped(p)).length;
        res = ids ? {ids, warn:""} : {err: n < 4 ? "AI매칭에 쓸 대기 선수가 부족해요 (" + n + "명)" : "함께 들어갈 4명을 맞추지 못했어요. 고정 파트너가 게임 중인지 확인해 주세요"};
      } else res = recommend(b.dataset.v, pool);
      if(res.err){ s.msg = res.err; } else { s.chosen = res.ids; s.msg = res.warn || ""; s.sameOk = false; }
      renderSelectSheet(s); break;
    }
    case "confirmSelect": {
      if(s.chosen.length !== 4) break;
      const k = groupKey(s.chosen);
      const same = s.chosen.every(x => P(x).lastGroup === k);
      const go = () => {
        if(s.mode === "court"){
          const ci = s.court;
          if(state.courts[ci].players){ toast("그 코트에 이미 게임이 있어요"); closeSheet(); return; }
          startGame(ci, s.chosen); commit(); closeSheet(); toast((ci+1) + "번 코트 게임을 시작했어요");
        } else {
          if(s.editIdx >= 0){ state.reserves[s.editIdx] = {players:s.chosen.slice(), teams:null}; }
          else { if(state.reserves.length >= MAX_RESERVES){ closeSheet(); toast("예약은 " + MAX_RESERVES + "게임까지예요"); return; } state.reserves.push({players:s.chosen.slice(), teams:null}); }
          commit(); closeSheet(); toast("예약했어요");
        }
      };
      if(same && !s.sameOk){ s.sameOk = true; s.msg = "직전 게임과 같은 4명이에요. 그대로 하려면 버튼을 한 번 더 눌러 주세요"; renderSelectSheet(s); break; }
      go(); break;
    }
    case "startResv": {
      const rv = state.reserves[r]; if(!rv) break;
      let ci = c; if(!(ci >= 0) || state.courts[ci].players) ci = state.courts.findIndex(x => !x.players);
      if(ci < 0){ toast("빈 코트가 없어요"); break; }
      if(rv.players.length < 4 || rv.players.some(x => P(x).status !== "waiting")){ toast("예약 선수가 모두 대기 중일 때 시작할 수 있어요"); break; }
      startGame(ci, rv.players, rv.teams); state.reserves.splice(r, 1); commit(); toast((ci+1) + "번 코트에서 예약 게임을 시작했어요");
      break;
    }
    case "split": splitCourt(c); commit(); break;
    case "cancel": confirmBox((c+1) + "번 코트 게임을 취소할까요?", "게임 수는 늘지 않고, 네 명은 배정 전 대기 상태로 돌아가요.", "게임 취소", () => { cancelGame(c); commit({noAuto:true}); toast("게임을 취소했어요"); }); break;
    case "end": snapshotForUndo(); endGame(c); commit({noAuto:true}); toast((c+1) + "번 코트 게임을 종료했어요", true); break;
    case "courtPlus": if(state.courtCount < 12){ state.courtCount++; commit(); } break;
    case "courtMinus": {
      if(state.courtCount <= 1) break;
      const last = state.courts[state.courtCount - 1];
      if(last && last.players){ toast(state.courtCount + "번 코트에 게임이 있어 줄일 수 없어요"); break; }
      state.courtCount--; commit(); break;
    }
    case "reset": {
      const playing = state.courts.filter(x => x.players).length;
      confirmBox("하루 초기화할까요?", (playing ? "진행 중인 " + playing + "게임은 기록 없이 끝나요. " : "") + "게임 수, 대기시간, 기록, 예약이 모두 지워지고 선수는 저장된 선수로 이동해요.", "초기화", () => {
        snapshotForUndo();
        Object.values(state.players).forEach(p => { p.games = 0; p.waitTotal = 0; p.waitSince = null; p.status = "gone"; p.lastGroup = ""; p.lateAt = ""; p.coachStreak = 0; p.coachRest = 0; });
        state.courts = []; state.reserves = []; state.log = [];
        commit(); toast("하루 초기화를 마쳤어요", true);
      }, true);
      break;
    }
    case "confirmYes": { const fn = s.onYes; closeSheet(); fn(); break; }
  }
});

// 시간 표시 갱신 (저장은 하지 않음)
setInterval(() => { if(!document.hidden){ const y = window.scrollY; render(); window.scrollTo(0, y); } }, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) render(); });

// ---------- 시작 ----------
const local = loadLocal();
if(local){ state = Object.assign(freshState(), local); }
ensureCourts();
render();
initRemote();
})();
</script>
